coverage:
  range: '50...90'
  round: down
  precision: 2

  status:
    project:
      default:
        target: auto
        threshold: 2%
        informational: true
    patch:
      default:
        target: 50%
        informational: true

  ignore:
    - '**/*_test.go'

comment:
  layout: 'reach, diff, files'
  behavior: default
  require_changes: false
