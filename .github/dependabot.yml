version: 2

updates:
  # Go 模块依赖
  - package-ecosystem: 'gomod'
    directory: '/'
    schedule:
      interval: 'daily'
    labels:
      - 'dependencies'
      - 'go'

  # GitHub Actions 依赖（扫描 .github/workflows 下的第三方 action 版本）
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    labels:
      - 'dependencies'
      - 'github-actions'
