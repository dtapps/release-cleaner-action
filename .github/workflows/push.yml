name: Push 构建检查

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/dtapps/golang:latest
      env:
        GIT_SHIM_SAFE_DIRECTORY: 'true'
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 设置 Go 工具链目录
        shell: bash
        run: |
          echo "GO_PATH_DIR=/go" >> "$GITHUB_ENV"
          echo "GO_BIN_DIR=/go/bin" >> "$GITHUB_ENV"
      - name: 缓存 Go module
        uses: actions/cache@v6
        with:
          path: ${{ env.GO_PATH_DIR }}/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-
      - name: 缓存 Go build 缓存
        uses: actions/cache@v6
        with:
          path: ${{ format('{0}/.cache/go-build', env.HOME) }}
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-
      - name: 安装依赖
        run: make deps
      - name: 项目检查
        run: make check
