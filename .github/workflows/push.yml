name: Push 构建检查

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: 运行测试
        run: go test ./...

      - name: 静态检查
        run: go vet ./...

      - name: 构建
        run: go build -o /tmp/release-cleaner .

      - name: 构建 Docker 镜像
        run: docker build -t release-cleaner:test .
