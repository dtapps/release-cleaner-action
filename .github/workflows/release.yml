name: 发布 Release 版本

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本 tag，例如 v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 校验版本 tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本 tag 必须符合 vX.Y.Z 格式，当前值：$TAG"
            exit 1
          fi

      - name: 检出代码
        uses: actions/checkout@v7

      - name: 检查 Release 是否已存在
        id: check
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 发布 Release
        if: steps.check.outputs.exists == 'false'
        run: |
          gh release create "$TAG" \
            --title "Release Cleaner $TAG" \
            --generate-notes
          echo "Release 已发布：${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
          echo "如需上架 Marketplace，请编辑该 Release，勾选 Publish this Action to the GitHub Marketplace 并设置分类。"
