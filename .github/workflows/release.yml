name: 发布 Release 版本

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本 tag，例如 v1.0.0'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/dtapps/release-cleaner-action

jobs:
  prepare:
    name: 校验发布版本
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 校验版本 tag
        id: version
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本 tag 必须符合 vX.Y.Z 格式，当前值：$TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: 检查远端 tag 是否存在
        id: tag_check
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 通过 API 创建 tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="${{ github.sha }}"
          echo "Tag $TAG 已由工作流创建"

  build:
    name: 构建 ${{ matrix.goarch }} 发布镜像
    runs-on: ${{ matrix.os }}
    needs: prepare
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            goarch: amd64
          - os: ubuntu-26.04-arm
            goarch: arm64
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3
      - name: 登录镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.goarch }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.tag }}-${{ matrix.goarch }}
          provenance: false
          sbom: false

  manifest:
    name: 合并发布镜像
    runs-on: ubuntu-26.04
    needs: [prepare, build]
    steps:
      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3
      - name: 登录镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 合并版本与 latest 多架构镜像
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:$TAG" \
            "$IMAGE_NAME:$TAG-amd64" \
            "$IMAGE_NAME:$TAG-arm64"
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:latest" \
            "$IMAGE_NAME:$TAG-amd64" \
            "$IMAGE_NAME:$TAG-arm64"
      - name: 检查多架构镜像
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          docker buildx imagetools inspect "$IMAGE_NAME:$TAG"
          docker buildx imagetools inspect "$IMAGE_NAME:latest"

  release:
    name: 发布 Release
    runs-on: ubuntu-26.04
    needs: [prepare, manifest]
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - name: 检查 Release 是否已存在
        id: check
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 生成 Release 正文
        run: |
          previous_tag=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          if [ -n "$previous_tag" ]; then
            range="$previous_tag..HEAD"
          else
            range="HEAD"
          fi

          {
            echo "## 变更内容"
            echo
            git log --reverse --pretty=format:'- %s (%h)' --no-merges "$range"
            echo
          } > release-notes.md
      - name: 发布 Release
        if: steps.check.outputs.exists == 'false'
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "Release Cleaner $TAG" \
            --notes-file release-notes.md
          echo "Release 已发布：${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
          echo "如需上架 Marketplace，请编辑该 Release，勾选 Publish this Action to the GitHub Marketplace 并设置分类。"

  skillhub-config:
    name: 检查 SkillHub Token
    runs-on: ubuntu-26.04
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
    steps:
      - name: 检查 SkillHub Token
        id: config
        env:
          SKILLHUB_TOKEN: ${{ secrets.SKILLHUB_TOKEN }}
        run: |
          if [ -z "$SKILLHUB_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  skillhub:
    name: 发布 SkillHub
    runs-on: ubuntu-26.04
    needs: [prepare, release, skillhub-config]
    if: needs.skillhub-config.outputs.enabled == 'true'
    continue-on-error: true
    permissions:
      contents: read
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      SKILLHUB_HOST: https://api.skillhub.cn
      SKILL_DIR: skills/github-release-cleaner-action-use
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: 同步 Skill 版本
        run: |
          version="${TAG#v}"
          SKILL_VERSION="$version" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["SKILL_DIR"]) / "SKILL.md"
          text = path.read_text()
          text, count = re.subn(
              r"(?m)^version:.*$",
              f"version: '{os.environ['SKILL_VERSION']}'",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("SKILL.md 缺少 version 字段")
          path.write_text(text)
          PY
      - name: 安装 SkillHub CLI
        run: |
          curl -fsSL https://skillhub.cn/install/install.sh | bash -s -- --cli-only
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: 验证 SkillHub CLI
        run: skillhub --version
      - name: 登录 SkillHub
        env:
          SKILLHUB_TOKEN: ${{ secrets.SKILLHUB_TOKEN }}
        run: |
          skillhub login --key "$SKILLHUB_TOKEN" --host "$SKILLHUB_HOST"
          skillhub auth whoami
      - name: 预检 Skill
        run: skillhub publish "$SKILL_DIR" --dry-run
      - name: 发布 Skill
        run: skillhub publish "$SKILL_DIR" --changelog "发布 $TAG"

  clawhub-config:
    name: 检查 ClawHub Token
    runs-on: ubuntu-26.04
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
    steps:
      - name: 检查 ClawHub Token
        id: config
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [ -z "$CLAWHUB_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  clawhub:
    name: 发布 ClawHub
    runs-on: ubuntu-26.04
    needs: [prepare, release, clawhub-config]
    if: needs.clawhub-config.outputs.enabled == 'true'
    continue-on-error: true
    permissions:
      contents: read
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      SKILL_DIR: skills/github-release-cleaner-action-use
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: 同步 Skill 版本
        id: skill
        run: |
          version="${TAG#v}"
          SKILL_VERSION="$version" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["SKILL_DIR"]) / "SKILL.md"
          text = path.read_text()
          parts = text.split("---", 2)
          if len(parts) != 3 or parts[0].strip():
              raise SystemExit("SKILL.md 缺少 frontmatter")
          metadata = parts[1]

          def field(name):
              match = re.search(
                  rf"(?m)^{re.escape(name)}:[ \t]*(.*?)[ \t]*$",
                  metadata,
              )
              if match is None or not match.group(1):
                  raise SystemExit(f"SKILL.md 缺少 {name} 字段")
              value = match.group(1)
              if len(value) >= 2 and value[0] == value[-1] and value[0] in "'\"":
                  value = value[1:-1]
              return value

          slug = field("slug")
          display_name = field("displayName")
          text, count = re.subn(
              r"(?m)^version:.*$",
              f"version: '{os.environ['SKILL_VERSION']}'",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("SKILL.md 缺少 version 字段")
          path.write_text(text)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"slug={slug}\n")
              output.write(f"display_name={display_name}\n")
              output.write(f"version={os.environ['SKILL_VERSION']}\n")
          PY
      - name: 安装 ClawHub CLI
        run: npm install --global clawhub
      - name: 验证 ClawHub CLI
        run: clawhub --help
      - name: 登录 ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          clawhub login --token "$CLAWHUB_TOKEN"
          clawhub whoami
      - name: 预检 Skill
        env:
          SKILL_SLUG: ${{ steps.skill.outputs.slug }}
          SKILL_NAME: ${{ steps.skill.outputs.display_name }}
          SKILL_VERSION: ${{ steps.skill.outputs.version }}
        run: |
          clawhub skill publish "$SKILL_DIR" \
            --slug "$SKILL_SLUG" \
            --name "$SKILL_NAME" \
            --version "$SKILL_VERSION" \
            --tags latest \
            --dry-run
      - name: 发布 Skill
        env:
          SKILL_SLUG: ${{ steps.skill.outputs.slug }}
          SKILL_NAME: ${{ steps.skill.outputs.display_name }}
          SKILL_VERSION: ${{ steps.skill.outputs.version }}
        run: |
          clawhub skill publish "$SKILL_DIR" \
            --slug "$SKILL_SLUG" \
            --name "$SKILL_NAME" \
            --version "$SKILL_VERSION" \
            --tags latest \
            --changelog "发布 $TAG"

  secure-skills-config:
    name: 检查 360 Secure Skills Token
    runs-on: ubuntu-26.04
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
    steps:
      - name: 检查 Secure Skills Token
        id: config
        env:
          SECURE_SKILLS_TOKEN: ${{ secrets.SECURE_SKILLS_TOKEN }}
        run: |
          if [ -z "$SECURE_SKILLS_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  secure-skills:
    name: 发布 Secure Skills
    runs-on: ubuntu-26.04
    needs: [prepare, release, secure-skills-config]
    if: needs.secure-skills-config.outputs.enabled == 'true'
    continue-on-error: true
    permissions:
      contents: read
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      SKILL_DIR: skills/github-release-cleaner-action-use
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: 同步 Skill 版本
        id: skill
        run: |
          version="${TAG#v}"
          SKILL_VERSION="$version" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["SKILL_DIR"]) / "SKILL.md"
          text = path.read_text()
          parts = text.split("---", 2)
          if len(parts) != 3 or parts[0].strip():
              raise SystemExit("SKILL.md 缺少 frontmatter")
          metadata = parts[1]

          def field(name):
              match = re.search(
                  rf"(?m)^{re.escape(name)}:[ \t]*(.*?)[ \t]*$",
                  metadata,
              )
              if match is None or not match.group(1):
                  raise SystemExit(f"SKILL.md 缺少 {name} 字段")
              value = match.group(1)
              if len(value) >= 2 and value[0] == value[-1] and value[0] in "'\"":
                  value = value[1:-1]
              return value

          slug = field("slug")
          display_name = field("displayName")
          text, count = re.subn(
              r"(?m)^version:.*$",
              f"version: '{os.environ['SKILL_VERSION']}'",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("SKILL.md 缺少 version 字段")
          path.write_text(text)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"slug={slug}\n")
              output.write(f"display_name={display_name}\n")
              output.write(f"version={os.environ['SKILL_VERSION']}\n")
          PY
      - name: 安装 Secure Skills CLI
        run: npm install --global secure-skills-cli
      - name: 验证 Secure Skills CLI
        run: secure-skills --cli-version
      - name: 登录 Secure Skills
        env:
          SECURE_SKILLS_TOKEN: ${{ secrets.SECURE_SKILLS_TOKEN }}
        run: |
          secure-skills login --token "$SECURE_SKILLS_TOKEN"
          secure-skills whoami
      - name: 发布 Skill
        env:
          SKILL_SLUG: ${{ steps.skill.outputs.slug }}
          SKILL_NAME: ${{ steps.skill.outputs.display_name }}
          SKILL_VERSION: ${{ steps.skill.outputs.version }}
        run: |
          secure-skills publish "$SKILL_DIR" \
            --slug "$SKILL_SLUG" \
            --name "$SKILL_NAME" \
            --version "$SKILL_VERSION" \
            --changelog "发布 $TAG"
